<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="さくらんぼ">
<meta name="theme-color" content="#FFF5F5">
<title>さくらんぼ けいさん｜MieeL</title>
<style>
  /* ============================================================
     さくらんぼ けいさん（くりあがり・くりさがり）  見た目（CSS）
     ============================================================ */
  :root {
    --mieel: radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
    --bg: #FFF7F3; --ink: #1F2937; --sub: #6B7280; --line: #F1DCD3;
    --go: #2F9E44; --go-d: #237A34; --blue: #1C7ED6; --blue-d: #1864AB;
    --orange: #F76707; --pink: #F06595; --gold: #FAB005; --red: #E03131; --cherry: #E03131;
    --cs: clamp(30px, min(5vw, 6.4vh), 60px);
    --emo: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-weight: 700; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .emo { font-family: var(--emo); font-weight: 400; line-height: 1; }

  .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 64px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 8px; border-radius: 999px; background: #fff; border: 3px solid var(--line); font-size: 20px; white-space: nowrap; }
  .chip .emo { font-size: 28px; }
  .brand { flex: 1; display: flex; justify-content: center; align-items: center; gap: 14px; color: #C98A7A; font-size: 16px; letter-spacing: .1em; min-width: 0; }
  .mieel-brand { display: flex; align-items: center; gap: 7px; white-space: nowrap; flex: none; }
  .orb-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--mieel); flex: none; }
  .mieel-brand strong { font-size: 16px; color: var(--ink); }
  .mieel-brand .url { font-size: 12px; color: var(--sub); font-weight: 600; }
  .mieel-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid #E9ECEF; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.8; }
  .mieel-foot .mieel-brand { justify-content: center; }
  .mieel-foot a { color: #1C7ED6; font-weight: 700; text-decoration: none; font-size: 14px; }
  .gear { position: relative; width: 52px; height: 52px; border-radius: 50%; border: none; background: transparent; opacity: .35; font-size: 26px; display: grid; place-items: center; }
  .gear::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 4px solid transparent; }
  .gear.pressing { opacity: 1; }
  .gear.pressing::after { border-color: var(--blue); animation: ring 1.5s linear forwards; }
  @keyframes ring { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 18px 14px; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; gap: clamp(6px, 1.2vh, 12px); animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  @keyframes pulse { to { transform: scale(1.07); } }
  .shake { animation: shake .45s; }
  .title { font-size: clamp(24px, 3.8vw, 46px); text-align: center; margin: 0; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
  .title small { display: block; font-size: .5em; color: var(--sub); }
  .actions { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .big-btn { min-width: min(300px, 78vw); min-height: 84px; padding: 0 32px; border: none; border-radius: 999px; color: #fff; font-size: clamp(22px, 3.2vw, 38px); display: inline-flex; align-items: center; justify-content: center; gap: 12px; }
  .big-btn.go { background: var(--go); box-shadow: 0 8px 0 var(--go-d); }
  .big-btn.blue { background: var(--blue); box-shadow: 0 8px 0 var(--blue-d); }
  .big-btn.white { background: #fff; color: var(--ink); box-shadow: 0 8px 0 var(--line); border: 4px solid var(--line); }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .mid-btn { min-height: 60px; padding: 0 22px; border-radius: 999px; border: 4px solid var(--line); background: #fff; font-size: clamp(17px, 2.1vw, 23px); box-shadow: 0 5px 0 var(--line); display: inline-flex; align-items: center; gap: 8px; }
  .mid-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .mid-btn.weak { border-color: #FFC9C9; background: #FFF5F5; color: #C92A2A; box-shadow: 0 5px 0 #FFC9C9; }

  /* マップ */
  .maphead { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .islands { display: flex; flex-direction: column; gap: 14px; padding: 4px 2px 10px; }
  .island { background: #fff; border-radius: 28px; border: 4px solid var(--c); padding: 10px 14px 14px; }
  .island h2 { margin: 0 0 8px; font-size: clamp(19px, 2.5vw, 27px); color: var(--c); display: flex; align-items: center; gap: 8px; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 28vw), 1fr)); gap: 10px; }
  .scard { position: relative; border: 4px solid var(--line); border-radius: 22px; background: #FFFCFA; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; font-size: clamp(14px, 1.8vw, 18px); line-height: 1.25; min-height: 116px; }
  .scard .no { position: absolute; left: 8px; top: 6px; width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 15px; }
  .scard .pv { font-size: clamp(24px, 3vw, 32px); color: var(--c); height: 44px; display: grid; place-items: center; letter-spacing: .02em; }
  .scard .st { font-size: 20px; letter-spacing: 2px; color: var(--gold); }
  .scard .st i { font-style: normal; color: #DEE2E6; }
  .scard.lock { opacity: .45; }
  .scard.next { border-color: var(--c); box-shadow: 0 0 0 4px rgba(250, 176, 5, .5); animation: pulse 1s ease-in-out infinite alternate; }
  .scard:active { transform: translateY(3px); }

  /* あそぶ */
  .track { position: relative; display: flex; align-items: center; padding: 30px 10px 2px; }
  .stop { flex: 1; display: flex; justify-content: center; position: relative; }
  .stop::before { content: ""; position: absolute; top: 50%; right: 50%; width: 100%; height: 6px; background: var(--line); transform: translateY(-50%); border-radius: 6px; }
  .stop:first-child::before { display: none; }
  .stop.done::before { background: var(--gold); }
  .stop i { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 4px solid var(--line); }
  .stop.done i { background: #FFE066; border-color: var(--gold); }
  .stop.goal i { width: 32px; height: 32px; border-color: var(--pink); background: #FFDEEB; }
  .runner { position: absolute; top: 0; left: 0; transform: translateX(-50%); font-size: 30px; transition: left .6s cubic-bezier(.3, 1.4, .5, 1); font-family: var(--emo); z-index: 2; }
  .timebar { height: 16px; border-radius: 999px; background: #fff; border: 3px solid var(--line); overflow: hidden; }
  .timebar i { display: block; height: 100%; background: linear-gradient(90deg, #69DB7C, #FFD43B); width: 100%; }
  .speedinfo { text-align: center; font-size: clamp(18px, 2.4vw, 26px); }

  .ask { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: clamp(21px, 3.1vw, 38px); text-align: center; word-break: keep-all; min-height: 1.4em; }
  .ask .no { background: var(--cherry); color: #fff; border-radius: 999px; padding: 0 .5em; font-size: .8em; }
  .ask .say { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--line); background: #fff; font-size: 22px; flex: none; }
  .story { font-size: clamp(20px, 2.8vw, 32px); text-align: center; line-height: 1.6; background: #fff; border-radius: 22px; padding: 10px 18px; border: 4px solid var(--line); }
  .story .pics { font-family: var(--emo); font-size: 1.4em; letter-spacing: .06em; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .story .pics span { display: inline-block; max-width: 6.3em; }

  /* しき と さくらんぼ */
  .expr { display: flex; align-items: flex-start; justify-content: center; gap: .28em; font-size: clamp(46px, min(7.4vw, 9vh), 96px); line-height: 1; padding-top: 4px; }
  .tk { position: relative; display: flex; flex-direction: column; align-items: center; min-width: .65em; }
  .tk.op { color: var(--sub); }
  .tk .lines { width: 1.7em; height: .42em; display: block; }
  .tk .berries { display: flex; gap: .3em; }
  .berry { width: 1.45em; height: 1.45em; border-radius: 50%; border: 4px solid var(--cherry); background: #FFF5F5; display: grid; place-items: center; font-size: .42em; color: var(--cherry); line-height: 1; }
  .berry.q { color: #FFC9C9; }
  .berry.now, .box.now { animation: pulse .7s ease-in-out infinite alternate; box-shadow: 0 0 0 6px #FFE066; }
  .berry.fill, .box.fill { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
  .box { min-width: 1.2em; height: 1.12em; padding: 0 .1em; border: 5px solid var(--ink); border-radius: 14px; display: grid; place-items: center; color: var(--blue); background: #fff; }
  .box.q { color: #CED4DA; }

  /* 10の わく */
  .frames { display: flex; gap: clamp(12px, 3vw, 34px); justify-content: center; align-items: center; flex-wrap: wrap; min-height: calc(var(--cs) * 2 + 10px); }
  .tfw { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tfw small { font-size: 15px; color: var(--sub); }
  .tf { display: grid; grid-template-columns: repeat(5, var(--cs)); grid-template-rows: repeat(2, var(--cs)); border: 4px solid #495057; background: #FFFDF5; border-radius: 6px; transition: box-shadow .3s; }
  .tf .cell { border: 1.5px solid #ADB5BD; display: grid; place-items: center; position: relative; }
  .tf.full { box-shadow: 0 0 0 7px #FFE066; }
  .tf.tap .st { cursor: pointer; }
  .tf.tap .st:not(.gone) { animation: wob 1.2s ease-in-out infinite; }
  @keyframes wob { 50% { transform: scale(1.08); } }
  .st { width: 80%; height: 80%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6C757D, #111 62%); }
  .st.b { background: radial-gradient(circle at 35% 30%, #FFC078, #E8590C 65%); }
  .st.gone { opacity: .2; animation: none !important; }
  .st.gone::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--red); font-size: calc(var(--cs) * .7); font-weight: 900; opacity: 1; }
  .cell .st.gone { position: relative; }
  .fly { position: fixed; z-index: 30; border-radius: 50%; pointer-events: none; transition: transform .38s cubic-bezier(.3, .9, .4, 1); }
  .plus { font-size: calc(var(--cs) * 1.1); color: var(--sub); }
  .note10 { font-size: clamp(20px, 2.6vw, 30px); color: #E8590C; text-align: center; min-height: 1.3em; }

  /* こたえる */
  .answer { display: flex; justify-content: center; }
  .choices { display: flex; gap: clamp(10px, 2vw, 20px); justify-content: center; flex-wrap: wrap; }
  .cbtn { min-width: clamp(92px, 13vw, 140px); min-height: clamp(84px, 12vh, 126px); padding: 4px 14px; border-radius: 28px; border: 5px solid var(--line); background: #fff; box-shadow: 0 7px 0 var(--line); font-size: clamp(46px, min(7vw, 8vh), 84px); }
  .cbtn.txt { font-size: clamp(30px, 4.6vw, 54px); }
  .cbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--line); }
  .cbtn.ok { border-color: var(--go); background: #EBFBEE; box-shadow: 0 7px 0 #8CE99A; }
  .cbtn.ng { opacity: .35; }
  .pad { display: grid; grid-template-columns: repeat(6, auto); gap: 8px; align-items: center; justify-content: center; }
  .pad .disp { grid-column: span 6; justify-self: center; min-width: 3em; height: 1.25em; border: 5px solid var(--ink); border-radius: 16px; display: grid; place-items: center; font-size: clamp(38px, 6vw, 64px); background: #fff; color: var(--blue); }
  .pad button { width: clamp(56px, 8.5vw, 84px); height: clamp(52px, 7.6vh, 76px); border-radius: 18px; border: 4px solid var(--line); background: #fff; box-shadow: 0 5px 0 var(--line); font-size: clamp(26px, 3.6vw, 40px); }
  .pad button.ok { background: var(--go); color: #fff; border-color: var(--go); box-shadow: 0 5px 0 var(--go-d); }
  .pad button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: auto; }
  .hint { border: 3px solid #FFE066; background: #FFF9DB; color: #8F6D00; font-size: 18px; padding: 10px 18px; border-radius: 999px; }
  .quit { position: relative; overflow: hidden; border: 2px solid #DEE2E6; background: #fff; color: #868E96; font-size: 16px; padding: 10px 14px; border-radius: 999px; touch-action: none; }
  .quit i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #FFE3E3; }
  .quit span { position: relative; }
  .quit.pressing { color: #E03131; border-color: #FFA8A8; }
  .quit.pressing i { width: 100%; transition: width 1.5s linear; }

  .praise { position: fixed; left: 50%; top: 36%; transform: translate(-50%, -50%); font-size: clamp(52px, 9vw, 118px); font-weight: 900; color: var(--orange); white-space: nowrap; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; pointer-events: none; z-index: 40; animation: praise 1.2s ease-out forwards; }
  @keyframes praise { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 22% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; } 70% { transform: translate(-50%, -54%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -70%); opacity: 0; } }
  .center { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2vh, 18px); text-align: center; }
  .stars { font-size: clamp(56px, 11vh, 104px); letter-spacing: 8px; }
  .stars span { display: inline-block; animation: spinin .7s cubic-bezier(.2, 1.4, .4, 1) both; font-family: var(--emo); }
  .stars span.off { filter: grayscale(1); opacity: .25; }
  @keyframes spinin { from { transform: rotate(-360deg) scale(0); } to { transform: none; } }
  .sticker-big { font-size: clamp(84px, 15vh, 140px); line-height: 1.1; font-family: var(--emo); animation: spinin 1s cubic-bezier(.2, 1.3, .4, 1) .5s both; }
  .bookgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; flex: 1; align-content: start; }
  .slot { aspect-ratio: 1; border-radius: 20px; background: #fff; border: 4px solid var(--line); display: grid; place-items: center; font-size: clamp(34px, min(6vw, 8vh), 70px); font-family: var(--emo); }
  .slot.no { background: #F8EEEA; color: #DCC6BE; font-family: inherit; font-size: 30px; }

  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
  @media (orientation: portrait) { .bookgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  /* iPhone など */
  @media (max-width: 600px), (max-height: 520px) {
    :root { --cs: clamp(22px, min(6.4vw, 5.6vh), 40px); }
    .topbar { min-height: 50px; padding: 4px 10px; gap: 8px; }
    .topbar .appname, .topbar .url { display: none; }
    .chip { font-size: 15px; padding: 2px 10px 2px 6px; border-width: 2px; } .chip .emo { font-size: 20px; }
    .gear { width: 44px; height: 44px; font-size: 22px; }
    main { padding: 0 10px 10px; }
    .title { font-size: 21px; }
    .big-btn { min-width: 0; min-height: 58px; padding: 0 20px; font-size: 20px; box-shadow: 0 5px 0 var(--go-d); }
    .big-btn.blue { box-shadow: 0 5px 0 var(--blue-d); } .big-btn.white { box-shadow: 0 5px 0 var(--line); }
    .mid-btn { min-height: 46px; padding: 0 12px; font-size: 15px; }
    .ask { font-size: 18px; } .ask .say { width: 38px; height: 38px; font-size: 17px; }
    .expr { font-size: 42px; }
    .berry { border-width: 3px; } .box { border-width: 4px; border-radius: 10px; }
    .track { padding-top: 26px; } .runner { font-size: 24px; } .stop i { width: 16px; height: 16px; border-width: 3px; } .stop.goal i { width: 22px; height: 22px; }
    .cbtn { min-width: 70px; min-height: 64px; border-width: 4px; border-radius: 18px; box-shadow: 0 5px 0 var(--line); font-size: 38px; }
    .cbtn.txt { font-size: 24px; }
    .pad button { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; } .pad .disp { font-size: 30px; }
    .hint { font-size: 13px; padding: 7px 10px; } .quit { font-size: 12px; padding: 7px 9px; }
    .note10 { font-size: 16px; } .story { font-size: 16px; padding: 8px 10px; }
    .scard { min-height: 96px; font-size: 13px; border-width: 3px; } .scard .pv { height: 32px; font-size: 20px; } .scard .st { font-size: 15px; }
    .sgrid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .island { padding: 8px 8px 10px; border-radius: 20px; }
    .bookgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  }
  @media (max-width: 600px) and (orientation: portrait) { .pad { grid-template-columns: repeat(4, auto); } .pad .disp { grid-column: span 4; } }
  @media (max-height: 520px) and (orientation: landscape) {
    .track { display: none; }
    .expr { font-size: 36px; }
    .screen.play { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto 1fr auto; grid-template-areas: "q q" "e i" "f i" "z z"; gap: 4px 12px; }
    .play .ask { grid-area: q; } .play .exprwrap { grid-area: e; } .play .work { grid-area: f; } .play .answer { grid-area: i; align-self: center; } .play .foot { grid-area: z; }
    .play .choices { display: grid; grid-template-columns: repeat(2, auto); gap: 8px; }
  }

  /* ---------- 先生用：設定 ---------- */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(17, 24, 39, .55); display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .modal.open { display: flex; }
  .panel { width: min(100%, 900px); background: #fff; border-radius: 24px; padding: 22px clamp(14px, 4vw, 32px) 28px; font-weight: 400; font-size: 17px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel h2 { margin: 0; font-size: 25px; font-weight: 700; }
  .panel h3 { margin: 28px 0 10px; font-size: 20px; font-weight: 700; padding-left: 10px; border-left: 6px solid var(--cherry); }
  .panel h4 { margin: 14px 0 4px; }
  .note { color: var(--sub); font-size: 15px; line-height: 1.6; margin: 6px 0; }
  .panel label.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; border-bottom: 1px solid #F1F3F5; }
  .panel label.row > span:first-child { flex: 1; }
  .panel input[type=text], .panel select { font: inherit; font-size: 17px; padding: 9px 12px; border: 2px solid #CED4DA; border-radius: 12px; background: #fff; }
  .panel input[type=checkbox] { width: 28px; height: 28px; accent-color: var(--go); }
  .panel input[type=range] { width: 200px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 12px; padding: 11px 18px; font-size: 16px; font-weight: 700; background: #E9ECEF; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--blue); color: #fff; } .btn.ok { background: var(--go); color: #fff; } .btn.warn { background: #FFF0F0; color: #C92A2A; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }

function jaSay(t) {

  function seg(value, opts, onPick) { return h('div', { class: 'seg' }, opts.map(o => h('button', { type: 'button', class: String(o[0]) === String(value) ? 'on' : '', onclick: () => onPick(o[0]) }, o[1]))); }
  const srow = (label, ctl, note) => h('div', { class: 'srow' }, h('div', null, label, note ? h('div', { class: 'note' }, note) : null), ctl);
  const chk = (label, k, note) => h('label', { class: 'row' }, h('span', null, label, note ? h('div', { class: 'note' }, note) : null), h('input', { type: 'checkbox', checked: !!S()[k], onchange: e => { S()[k] = e.target.checked; persist(); } }));
  let viewPid = null;
  function renderSettings() {
    const P = $('#settingsPanel'); P.innerHTML = '';
    const add = (...a) => P.append(...a.filter(Boolean));
    const st = S();
    if (!store.profiles.some(p => p.id === viewPid)) viewPid = store.currentId;
    const vp = store.profiles.find(p => p.id === viewPid);
    add(h('div', { class: 'panel-head' }, h('h2', null, '⚙️ 先生用せってい'), h('button', { type: 'button', class: 'btn ok', onclick: closeSettings }, '✓ とじる')),
      h('p', { class: 'note' }, 'この画面は 右上の ⚙️ を 1.5秒 ながおし すると ひらきます。変更は すぐに保存されます（この端末のみ）。'));
    add(h('h3', null, '👦 あそぶ 子ども'));
    store.profiles.forEach((p, i) => add(h('div', { class: 'prow' },
      h('button', { type: 'button', class: 'mini-btn', onclick: () => { p.icon = ICONS[(ICONS.indexOf(p.icon) + 1) % ICONS.length]; persist(); refresh(); } }, E(p.icon)),
      h('input', { type: 'text', value: p.name, style: 'flex:1;min-width:140px', oninput: e => { p.name = e.target.value; persistSoon(); } }),
      h('span', { class: 'note' }, '★' + Object.values(p.stars).reduce((a, b) => a + b, 0) + '・シール ' + new Set(p.stickers).size),
      store.profiles.length > 1 ? h('button', { type: 'button', class: 'mini-btn warn', onclick: () => { if (confirm(p.name + ' を けしますか？（きろくも きえます）')) { store.profiles.splice(i, 1); if (store.currentId === p.id) store.currentId = store.profiles[0].id; persist(); refresh(); } } }, 'けす') : null)));
    add(h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn primary', onclick: () => { const np = newProfile('なまえ' + (store.profiles.length + 1), ICONS[store.profiles.length % ICONS.length]); store.profiles.push(np); viewPid = np.id; persist(); refresh(); } }, '＋ 子どもを ふやす')));

    add(h('h3', null, '🎮 あそびかた'),
      srow('こたえかた', seg(st.input, [['auto', 'おまかせ'], ['choice', 'えらぶ'], ['pad', 'すうじを うつ']], v => setS('input', v)), 'おまかせ：はじめは えらぶ、しきだけの ステージは すうじを うつ'),
      srow('えらぶ ボタンの かず', seg(st.choices, [[2, '2こ'], [3, '3こ'], [4, '4こ']], v => setS('choices', Number(v)))),
      srow('1かいの もんだい', seg(st.per, [[3, '3もん'], [5, '5もん'], [8, '8もん'], [10, '10もん']], v => setS('per', Number(v)))),
      srow('いしを うごかす・とる', seg(st.manip, [['tap', 'じぶんで タッチ'], ['auto', 'みて たしかめる（じどう）']], v => setS('manip', v)), 'タッチが むずかしい 子は「じどう」に'),
      chk('さくらんぼの ステージでも 10の わくを みせる', 'support', 'なれてきたら オフに して、しきと さくらんぼ だけで とく'),
      srow('スピード チャレンジ', seg(st.speedSec, [[30, '30びょう'], [60, '1ぷん'], [90, '1ぷん30びょう'], [120, '2ふん']], v => setS('speedSec', Number(v)))),
      chk('ぜんぶの ステージを あける', 'unlockAll'),
      srow('すすむ キャラ', h('div', { class: 'seg' }, CHARS.map(c => h('button', { type: 'button', class: c === st.character ? 'on' : '', style: 'min-width:48px;flex:none', onclick: () => setS('character', c) }, E(c))))));
    add(h('h3', null, '🔊 おと・ひょうじ'), chk('よみあげ', 'voice'), chk('こうかおん', 'sound'),
      srow('おおきさ', h('input', { type: 'range', min: '0.2', max: '1', step: '0.1', value: st.volume, onchange: e => { st.volume = Number(e.target.value); persist(); } })),
      srow('よみあげの はやさ', seg(st.rate, [[0.8, 'ゆっくり'], [0.95, 'ふつう'], [1.1, 'はやめ']], v => setS('rate', Number(v)))),
      chk('うごきを ひかえめに（はなび・クラッカー なし）', 'calm'));

    add(h('h3', null, '📊 きろく（1かいめで せいかいした わりあい）'),
      store.profiles.length > 1 ? srow('子ども', h('select', { onchange: e => { viewPid = e.target.value; refresh(); } }, store.profiles.map(p => h('option', { value: p.id, selected: p.id === viewPid }, p.name)))) : null,
      recordView(vp));

    add(h('h3', null, '🖨️ プリント（A4）'),
      srow('しゅるい', seg(pr.type, PR_TYPES.map(t => [t.id, t.e + ' ' + t.n.split('（')[0]]), v => { pr.type = v; pr.focus = 0; refresh(); })),
      ['cadd', 'fadd', 'add'].indexOf(pr.type) >= 0 ? srow('しき', seg(pr.focus, FOCUS_ADD, v => { pr.focus = Number(v); refresh(); })) : null,
      ['csub', 'sub'].indexOf(pr.type) >= 0 ? srow('しき', seg(pr.focus, FOCUS_SUB, v => { pr.focus = Number(v); refresh(); })) : null,
      srow('まいすう', seg(pr.pages, [[1, '1まい'], [2, '2まい'], [3, '3まい']], v => { pr.pages = Number(v); refresh(); })),
      srow('こたえ', seg(pr.answer, [[false, 'なし'], [true, 'こたえの ページを つける']], v => { pr.answer = v === true || v === 'true'; refresh(); })),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn primary', onclick: () => doPrint(pr.type, Object.assign({ profileId: vp.id }, pr)) }, '🖨️ いんさつ する')),
      h('p', { class: 'note' }, '「にがての しき」は 上で えらんだ 子の きろくから つくります。いんさつは A4・たて、よはく なし、「背景の グラフィック」オンが おすすめです。「やすみの しゅくだい メーカー」からも とりこめます。'));

    add(h('h3', null, '💡 このアプリの かんがえかた'),
      h('p', { class: 'note' }, '・くりあがり・くりさがりの もとは「10の まとまり」です。まず 10の ともだち（7と 3）と「10と いくつ」を たしかに します。', h('br'),
        '・たしざんは 9 → 8 → 7・6 の じゅんに、10の わくで いしを 1つずつ うごかして「10を つくる」ことを からだで おぼえ、つぎに さくらんぼ（かすう ぶんかい）で しきに します。ちいさい ＋ おおきい（3＋9）は おおきい ほうで 10を つくります。', h('br'),
        '・ひきざんは「10から とる」（げんかほう）が きほんです。13−9 は 13を 10と 3に わけ、10−9＝1、1と 3で 4。ひく かずが ちいさい ときは「すこしずつ ひく」（げんげんほう：12−3 → 12−2＝10、10−1＝9）も れんしゅう できます。', h('br'),
        '・まちがえても ばつは ありません。その ばで 10の わくで やりかたを みせ、もう いちど えらんで おわります。きろくの ひょうで にがてな しきが わかり、「にがてを れんしゅう」と「にがての しき」プリントで くりかえせます。'));
    add(h('div', { class: 'btns', style: 'margin-top:20px' },
      h('button', { type: 'button', class: 'btn warn', onclick: () => { if (confirm(vp.name + ' の きろく・ほし・シールを ぜんぶ けしますか？')) { Object.assign(vp, { stars: {}, stickers: [], fact: {}, log: [], best: 0 }); persist(); refresh(); } } }, '🗑 この子の きろくを けす'),
      h('button', { type: 'button', class: 'btn ok', onclick: closeSettings }, '✓ とじる')));
    add(h('div', { class: 'mieel-foot' }, h('div', { class: 'mieel-brand' }, h('span', { class: 'orb-mini' }), h('strong', null, 'MieeL')),
      h('a', { href: 'https://www.mieel-support-school.com/', target: '_blank', rel: 'noopener' }, 'www.mieel-support-school.com'),
      h('div', null, '© さくらんぼ けいさん（特別支援教育向け）・学校や家庭での利用は自由です（無断転載・再配布・販売はお断り）')));
  }
  function heatCell(c) {
    if (!c) return h('td', null, '');
    const r = c[0] / (c[0] + c[1]);
    return h('td', { class: 'c', style: 'background:' + (r >= 0.85 ? '#D3F9D8' : r >= 0.5 ? '#FFF3BF' : '#FFE3E3'), title: c[0] + ' / ' + (c[0] + c[1]) }, Math.round(r * 100) + '%');
  }
  function recordView(p) {
    const box = h('div');
    if (!p.log.length && !Object.keys(p.fact).length) { box.append(h('p', { class: 'note' }, 'まだ きろくが ありません。')); return box; }
    const ta = h('table', { class: 'heat' }, h('tr', null, h('th', null, 'たしざん'), [2, 3, 4, 5, 6, 7, 8, 9].map(b => h('th', null, '＋' + b))));
    for (let a = 2; a <= 9; a++) ta.append(h('tr', null, h('th', null, String(a)), [2, 3, 4, 5, 6, 7, 8, 9].map(b => a + b > 10 ? heatCell(p.fact[a + '+' + b]) : h('td', { class: 'na' }, ''))));
    const tb = h('table', { class: 'heat' }, h('tr', null, h('th', null, 'ひきざん'), [2, 3, 4, 5, 6, 7, 8, 9].map(b => h('th', null, '−' + b))));
    for (let m = 11; m <= 18; m++) tb.append(h('tr', null, h('th', null, String(m)), [2, 3, 4, 5, 6, 7, 8, 9].map(b => m - 10 < b ? heatCell(p.fact[m + '-' + b]) : h('td', { class: 'na' }, ''))));
    const weak = Object.keys(p.fact).filter(k => { const c = p.fact[k]; return c[1] > 0 && c[0] / (c[0] + c[1]) < 0.85; });
    box.append(h('p', { class: 'note' }, 'みどり 85%いじょう・きいろ 50%いじょう・あか それより した・しろ まだ でて いない。スピード チャレンジ じこベスト：' + p.best + 'もん'),
      h('div', { style: 'display:flex;gap:16px;flex-wrap:wrap' }, ta, tb),
      weak.length ? h('p', { class: 'note', style: 'color:#C92A2A' }, '🎯 にがてな しき：' + weak.map(k => k.replace('-', '−').replace('+', '＋')).join('、')) : null);
    const t2 = h('table', { class: 'rec-table' }, h('tr', null, ['日時', 'ステージ', 'せいかい', 'まちがい', 'じかん'].map(x => h('th', null, x))));
    p.log.slice().reverse().slice(0, 30).forEach(r => { const d = new Date(r.t); t2.append(h('tr', null, h('td', null, (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0')), h('td', null, r.name), h('td', null, r.ok + ' / ' + r.n), h('td', null, String(r.miss)), h('td', null, r.sec + 'びょう'))); });
    box.append(h('h4', null, 'さいきん あそんだ ステージ'), t2, h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn', onclick: () => csv(p) }, '⬇ CSV で ほぞん（Excel）')));
    return box;
  }
  function csv(p) {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [['しき', '1回目で正解', 'まちがい', '正解率'].map(q).join(',')];
    Object.keys(p.fact).sort().forEach(k => { const c = p.fact[k]; lines.push([k, c[0], c[1], Math.round(c[0] / (c[0] + c[1]) * 100) + '%'].map(q).join(',')); });
    lines.push('', ['日付', '時刻', 'ステージ', '正解', '問題数', 'まちがい', '秒'].map(q).join(','));
    p.log.forEach(r => { const d = new Date(r.t); lines.push([d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'), r.name, r.ok, r.n, r.miss, r.sec].map(q).join(',')); });
    const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' })), download: 'さくらんぼけいさん_' + p.name + '.csv' });
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  (function () {
    const g = $('#gear'); let t = 0;
    g.addEventListener('pointerdown', e => { e.preventDefault(); g.classList.add('pressing'); t = setTimeout(() => { g.classList.remove('pressing'); openSettings(); }, 1500); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, () => { clearTimeout(t); g.classList.remove('pressing'); }));
    g.addEventListener('contextmenu', e => e.preventDefault());
  })();
  $('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
  $('#whoChip').addEventListener('click', () => { if (screen !== 'play') renderWho(); });
  $('#bookChip').addEventListener('click', () => { if (screen !== 'play' && tapOk()) renderBook(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeak(); });

  if (/[?&]test=1/.test(location.search)) window.__sk = () => G;
  document.body.classList.toggle('calm', !!S().calm);
  if (canSpeak) { loadVoice(); if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; }
  if (store.profiles.length > 1 && !EMBED) renderWho(); else renderMap();
})();
</script>
</body>
</html>
